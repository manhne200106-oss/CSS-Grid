<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Gap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 30px;
        }

        .grid-container {
            display: grid;
            margin-bottom: 30px;
        }

        .grid-container div {
            padding: 20px;
            text-align: center;
        }

        /* Ví dụ 1 */
        .example1 {
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 20px;
        }

        .example1 div {
            background-color: lightblue;
        }

        /* Ví dụ 2 */
        .example2 {
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 30px 10px;
        }

        .example2 div {
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>CSS Grid - grid-gap</h1>

    <h2>Ví dụ 1: Thiết lập khoảng cách giữa hàng và cột</h2>

    <div class="grid-container example1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>


    <h2>Ví dụ 2: Thiết lập khoảng cách hàng và cột khác nhau</h2>

    <div class="grid-container example2">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

</body>
</html>
