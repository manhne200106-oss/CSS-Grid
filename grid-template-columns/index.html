<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-template-columns</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 30px;
        }

        .grid-container {
            display: grid;
            gap: 10px;
            margin-bottom: 30px;
        }

        .grid-container div {
            padding: 20px;
            text-align: center;
        }

        /* Ví dụ 1 */
        .example1 {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .example1 div {
            background-color: lightblue;
        }

        /* Ví dụ 2 */
        .example2 {
            grid-template-columns: 100px 200px 1fr;
        }

        .example2 div {
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>CSS Grid - grid-template-columns</h1>

    <h2>Ví dụ 1: Tạo 3 cột có kích thước bằng nhau</h2>

    <div class="grid-container example1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>


    <h2>Ví dụ 2: Tạo các cột có kích thước khác nhau</h2>

    <div class="grid-container example2">
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
    </div>

</body>
</html>
