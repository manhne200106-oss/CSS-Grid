<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-column-start</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 30px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .grid-container div {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }

        /* Ví dụ 1: auto */
        .auto .item1 {
            grid-column-start: auto;
        }

        /* Ví dụ 2: span 2 */
        .span .item1 {
            grid-column-start: span 2;
        }

        /* Ví dụ 3: column-line */
        .column-line .item1 {
            grid-column-start: 2;
        }
    </style>
</head>

<body>

    <h1>CSS Grid - grid-column-start</h1>

    <h2>Ví dụ 1: auto</h2>

    <div class="grid-container auto">
        <div class="item1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>


    <h2>Ví dụ 2: span 2</h2>

    <div class="grid-container span">
        <div class="item1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>


    <h2>Ví dụ 3: column-line</h2>

    <div class="grid-container column-line">
        <div class="item1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

</body>
</html>
